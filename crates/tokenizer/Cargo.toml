[package]
name = "ghita-tokenizer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GHITA exact BPE token counter via tiktoken-rs (v1.1.5-beta1 Track 4.1)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
addon = ["dep:napi", "dep:napi-derive", "dep:tiktoken-rs"]

[dependencies]
tiktoken-rs = { version = "0.6", optional = true }
napi = { version = "2", default-features = false, features = ["compat-mode", "napi4", "dyn-symbols"], optional = true }
napi-derive = { version = "2", optional = true }
