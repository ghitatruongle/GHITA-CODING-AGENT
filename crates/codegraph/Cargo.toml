[package]
name = "ghita-codegraph"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GHITA code-graph PageRank CSR + tree-sitter AST core (Track 8 A10/A11, v1.1.1) — std core + napi addon"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
addon = ["dep:napi", "dep:napi-derive", "dep:rayon"]
rayon = ["dep:rayon"]

[dependencies]
napi = { version = "2", default-features = false, features = ["compat-mode", "napi4", "dyn-symbols"], optional = true }
napi-derive = { version = "2", optional = true }
rayon = { version = "1.12.0", optional = true }
tree-sitter = "0.26.12"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
