[package]
name = "ghita-retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GHITA inverted-index BM25 retrieval core (Track 8 A8/A9) — std core + napi addon"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
addon = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { version = "2", default-features = false, features = ["compat-mode", "napi4", "dyn-symbols"], optional = true }
napi-derive = { version = "2", optional = true }
