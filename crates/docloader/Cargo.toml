[package]
name = "ghita-docloader"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GHITA document loader — pdf/docx/html-readability + mime detect (v1.1.5-beta1 Track 6.4/8.1)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# DOCX extraction pulls in the zip + quick-xml stack; kept opt-in so the
# std-only default build stays dependency-free.
docx = ["dep:zip", "dep:quick-xml"]
# Real PDF text extraction via pdf-extract (lopdf-based); heavier compile,
# opt-in for the same reason.
pdf = ["dep:pdf-extract"]
addon = ["dep:napi", "dep:napi-derive", "docx", "pdf"]

[dependencies]
napi = { version = "2", default-features = false, features = ["compat-mode", "napi4", "dyn-symbols"], optional = true }
napi-derive = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
quick-xml = { version = "0.36", optional = true }
pdf-extract = { version = "0.7", optional = true }

