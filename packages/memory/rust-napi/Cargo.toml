[package]
name = "ghita-memory-napi"
version = "0.1.0"
edition = "2021"
description = "Rust NAPI native addon for GHITA memory package: SIMD cosine similarity, HNSW index, parallel decay scoring"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
rayon = "1.10"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
ordered-float = "4"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
