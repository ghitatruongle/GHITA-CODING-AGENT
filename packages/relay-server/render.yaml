# ==============================================================================
# GHITA CODING AGENT — Render.com Blueprint Spec
# Deploy this Socket.io Cloud Relay Server automatically on Render Free Tier
# ==============================================================================

services:
  - type: web
    name: ghita-relay-server
    env: node
    plan: free
    region: singapore # Close to Vietnam for low latency
    buildCommand: pnpm install && pnpm --filter @ghita/shared build && pnpm --filter @ghita/relay-server build
    startCommand: pnpm --filter @ghita/relay-server start
    envVars:
      - key: PORT
        value: 3002
      - key: NODE_VERSION
        value: 20.0.0
      - key: PNPM_VERSION
        value: 10.14.0
