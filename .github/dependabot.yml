# ─────────────────────────────────────────────────────────────
# Dependabot — automated dependency updates
# Docs: https://docs.github.com/en/code-security/dependabot
# ─────────────────────────────────────────────────────────────

version: 2
updates:
  # ── pnpm (npm) ────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
      - "automerge"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "patch"
    ignore:
      # Major upgrades are manually reviewed
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # ── GitHub Actions ────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "automerge"
    commit-message:
      prefix: "ci"
      include: "scope"

  # ── Rust / Cargo (Tauri desktop) ──────────────────────────
  - package-ecosystem: "cargo"
    directory: "/apps/desktop/src-tauri/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
