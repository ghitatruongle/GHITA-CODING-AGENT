name: Generate Changelog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to generate changelog for'
        required: true
        default: '0.0.x'

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate changelog with git-cliff
        # orhun/git-cliff-action@v3 builds its own Docker image on the runner
        # and has been failing there ("Docker build failed with exit code 1").
        # Download the prebuilt binary directly instead — same flags as the
        # action (config: cliff.toml, args: --verbose --strip header, OUTPUT:
        # CHANGES.md), minus the Docker layer.
        run: |
          CLIFF_VERSION="2.13.1"
          curl -fsSL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/git-cliff-${CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          git-cliff-${CLIFF_VERSION}/git-cliff \
            --config cliff.toml \
            --verbose \
            --strip header \
            --output CHANGES.md

      - name: Merge with existing CHANGELOG
        run: |
          if [ -f CHANGES.md ] && [ -s CHANGES.md ]; then
            # Prepend new changes to existing changelog
            cat CHANGES.md > CHANGELOG.new.md
            echo "" >> CHANGELOG.new.md
            cat CHANGELOG.md >> CHANGELOG.new.md 2>/dev/null || true
            mv CHANGELOG.new.md CHANGELOG.md
            echo "Changelog updated successfully"
          else
            echo "No new changes to add"
          fi

      - name: Create Pull Request with changelog update
        # TODO: remove continue-on-error once "Allow GitHub Actions to create
        # and approve pull requests" is enabled (Settings → Actions → General →
        # Workflow permissions). Until then the action fails with "GitHub
        # Actions is not permitted to create or approve pull requests".
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: update changelog for ${{ github.ref_name || inputs.version }}"
          title: "docs: update changelog for ${{ github.ref_name || inputs.version }}"
          body: "Automated changelog update generated by git-cliff."
          branch: "changelog-update-${{ github.ref_name || inputs.version }}"
          base: main
          delete-branch: true
