name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version sync check
        run: node scripts/sync-version.mjs --check
      - name: Forbidden artifacts check
        run: node scripts/check-artifacts.mjs
      - name: Smell budget (as any ≤ 130)
        run: node scripts/count-smells.mjs --max-as-any=130

  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

  quality-loop-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Search Quality Loop Benchmark
        run: pnpm --filter @ghita/shared exec vitest run ../../tests/quality-loop/qualityLoop.test.ts

      - name: Run Automated Quality Loop Runner (CLI)
        run: pnpm benchmark:quality-loop --gate-min-f1=0.7

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repomap-quality-report
          path: |
            tests/quality-loop/repomap-quality.json
            tests/quality-loop/trends.jsonl
          retention-days: 30

  quality-loop-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Quality Loop Regression Gate
        run: pnpm --filter @ghita/shared exec vitest run ../../tests/quality-loop/benchmark.test.ts

  # ---------------------------------------------------------------------------
  # Coverage gate: honest tier floors from docs/coverage-tiers.json
  # Runs only T0/T1 core package tests (not full turbo test) to avoid
  # unrelated test failures blocking the coverage signal.
  # ---------------------------------------------------------------------------
  coverage-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run T0/T1 core package tests with coverage
        run: |
          pnpm --filter @ghita/security test:coverage
          pnpm --filter @ghita/agents test:coverage
          pnpm --filter @ghita/communication test:coverage
          pnpm --filter @ghita/ai-engine test:coverage
          pnpm --filter @ghita/memory test:coverage
          pnpm --filter @ghita/skills test:coverage

      - name: Check coverage thresholds (honest tier floors)
        run: node scripts/check-coverage-tiers.mjs --tiers=T0,T1 --require-summaries

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # API docs generation — verify TypeDoc builds cleanly (non-blocking)
  # ---------------------------------------------------------------------------
  api-docs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Generate API docs
        run: pnpm build:docs

      - name: Upload API docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/docs/api/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security audit — npm audit + dependency review (non-blocking)
  # ---------------------------------------------------------------------------
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (critical+ only)
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - name: Check unused dependencies (knip)
        run: pnpm knip --no-progress
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            pnpm-lock.yaml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Playwright E2E Smoke Tests — real browser, not mocks (non-blocking)
  # ---------------------------------------------------------------------------
  e2e-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build:packages

      - name: Run Playwright Smoke Tests
        run: npx playwright test tests/e2e/playwright-smoke.test.ts
        env:
          E2E_BASE_URL: http://localhost:1420

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Performance benchmarks (non-blocking, PR only)
  # ---------------------------------------------------------------------------
  performance-bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.5.2"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run AI Engine Benchmarks
        run: pnpm --filter @ghita/ai-engine exec vitest run ../../tests/performance/ai-engine.bench.ts --reporter=json --outputFile=bench-results.json

      - name: Run Communication Benchmarks
        run: pnpm --filter @ghita/communication exec vitest run ../../tests/performance/communication.bench.ts --reporter=json --outputFile=bench-comms.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results.json
            bench-comms.json
          retention-days: 30
