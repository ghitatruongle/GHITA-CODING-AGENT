name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build:packages

  quality-loop-benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Search Quality Loop Benchmark
        run: pnpm --filter @ghita/shared exec vitest run ../../tests/quality-loop/qualityLoop.test.ts

      - name: Run Automated Quality Loop Runner (CLI)
        run: pnpm benchmark:quality-loop --gate-min-f1=0.7

      - name: Upload Quality Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repomap-quality-report
          path: |
            tests/quality-loop/repomap-quality.json
            tests/quality-loop/trends.jsonl
          retention-days: 30

  quality-loop-regression:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run Quality Loop Regression Gate
        run: pnpm --filter @ghita/shared exec vitest run ../../tests/quality-loop/benchmark.test.ts

  # ---------------------------------------------------------------------------
  # Coverage gate: fail the build if any package drops below 80% line coverage
  # ---------------------------------------------------------------------------
  coverage-gate:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Check coverage thresholds
        run: |
          echo "=== Coverage Gate (≥80% lines) ==="
          FAILED=0
          for pkg in packages/a11y packages/agents packages/ai-engine packages/browser-control packages/code-graph packages/communication packages/computer-use packages/gui packages/i18n packages/integration packages/marketplace packages/memory packages/migration packages/mobile-companion packages/monitoring packages/notification packages/quotas packages/relay-server packages/security packages/shared packages/skills packages/voice; do
            SUMMARY_FILE="$pkg/coverage/coverage-summary.json"
            if [ -f "$SUMMARY_FILE" ]; then
              LINES=$(node -e "const c=require('./$SUMMARY_FILE');console.log(c.total.lines.pct)")
              echo "$pkg: ${LINES}% lines"
              if [ "$(echo "$LINES < 80" | bc -l)" -eq 1 ]; then
                echo "  ⚠️  Below 80% threshold!"
                FAILED=1
              fi
            else
              echo "  ❌ No coverage data for $pkg (missing vitest config or no tests?)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "❌ Coverage gate FAILED — one or more packages are below 80% or missing coverage."
            exit 1
          fi
          echo ""
          echo "✅ All packages meet the 80% line coverage threshold."

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 14

  # ---------------------------------------------------------------------------
  # API docs generation — verify TypeDoc builds cleanly on every PR
  # ---------------------------------------------------------------------------
  api-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Generate API docs
        run: pnpm build:docs

      - name: Upload API docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/docs/api/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security audit — npm audit + dependency review on every PR
  # ---------------------------------------------------------------------------
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm audit (critical+ only)
        run: pnpm audit --audit-level=critical
        continue-on-error: true

      - name: Check unused dependencies (knip)
        run: pnpm knip --no-progress
        continue-on-error: true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: |
            pnpm-lock.yaml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Playwright E2E Smoke Tests — real browser, not mocks
  # ---------------------------------------------------------------------------
  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build:packages

      - name: Run Playwright Smoke Tests
        run: npx playwright test tests/e2e/playwright-smoke.test.ts
        continue-on-error: true
        env:
          E2E_BASE_URL: http://localhost:1420

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Performance benchmarks — run on every PR, compare against baseline
  # ---------------------------------------------------------------------------
  performance-bench:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Run AI Engine Benchmarks
        run: pnpm --filter @ghita/ai-engine exec vitest run ../../tests/performance/ai-engine.bench.ts --reporter=json --outputFile=bench-results.json
        continue-on-error: true

      - name: Run Communication Benchmarks
        run: pnpm --filter @ghita/communication exec vitest run ../../tests/performance/communication.bench.ts --reporter=json --outputFile=bench-comms.json
        continue-on-error: true

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            bench-results.json
            bench-comms.json
          retention-days: 30
