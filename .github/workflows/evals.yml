name: evals-nightly

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC mỗi đêm
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build evals
        run: pnpm --filter @ghita/evals build

      - name: Eval suite + gate
        run: node scripts/evals-gate.mjs

      - name: MCP interop check
        run: |
          pnpm --filter @ghita/mcp --filter @ghita/code-graph --filter @ghita/browser-control --filter @ghita/memory --filter @ghita/skills build
          node scripts/mcp-interop-check.mjs

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: .ghita/evals/report.md
