name: Build Android

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ghita/shared build

      - name: Typecheck mobile
        run: pnpm --filter @ghita/mobile typecheck
        continue-on-error: true

      - name: Lint mobile
        run: pnpm --filter @ghita/mobile lint
        continue-on-error: true

      - name: Run mobile tests
        run: pnpm --filter @ghita/mobile test
        continue-on-error: true

      - name: Generate debug keystore (unsigned CI build)
        # debug.keystore is gitignored (see root .gitignore), so CI must
        # create it on the fly for the unsigned release build fallback.
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          "$JAVA_HOME/bin/keytool" -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Android APK
        working-directory: apps/mobile/android
        # GHITA_CI_UNSIGNED=true lets this verification build pass while the
        # ANDROID_KEYSTORE_* release secrets are not configured yet (see
        # app/build.gradle); once they exist the release build signs for real.
        run: ./gradlew assembleRelease
        env:
          GHITA_CI_UNSIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 == '' && 'true' || '' }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
