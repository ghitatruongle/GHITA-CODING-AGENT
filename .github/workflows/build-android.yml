name: Build Android

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @ghita/shared build

      - name: Typecheck mobile
        run: pnpm --filter @ghita/mobile typecheck

      - name: Lint mobile
        run: pnpm --filter @ghita/mobile lint
        continue-on-error: true

      - name: Run mobile tests
        run: pnpm --filter @ghita/mobile test
        continue-on-error: true

      - name: Build Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
