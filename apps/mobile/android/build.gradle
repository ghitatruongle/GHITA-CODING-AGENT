buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
    kotlinVersion = "1.9.24"
}

// Suppress jcenter() deprecation warnings from subprojects (libraries)
allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter() intentionally removed — all deps use mavenCentral now
    }
}

subprojects { subproject ->
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }

    // Force all subprojects to use mavenCentral (not jcenter)
    repositories {
        google()
        mavenCentral()
    }

    // Suppress warnings from RN codegen in subproject libraries
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            suppressWarnings.set(true)
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
