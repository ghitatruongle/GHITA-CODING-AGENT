buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
    kotlinVersion = "1.9.24"
}

// Suppress jcenter() deprecation warnings from subprojects (libraries)
allprojects {
    repositories {
        google()
        mavenCentral()
        // jcenter() intentionally removed — all deps use mavenCentral now
    }
}

subprojects { subproject ->
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            android {
                compileSdkVersion rootProject.ext.compileSdkVersion
                buildToolsVersion rootProject.ext.buildToolsVersion
            }
        }
    }

    // Force all subprojects to use mavenCentral (not jcenter)
    repositories {
        google()
        mavenCentral()
    }

    // Suppress C++ codegen $ identifier warnings from RN libraries
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        compilerOptions {
            suppressWarnings.set(true)
        }
    }

    // Suppress C++ $-in-identifier warnings in all generated codegen C++ files
    tasks.configureEach { task ->
        if (task.name.contains("externalNativeBuild") || task.name.contains("CMake")) {
            task.doFirst {
                // Environment variable approach: set CXXFLAGS for CMake
                if (task.hasProperty('cmakeArgs')) {
                    task.cmakeArgs = (task.cmakeArgs ?: []) + ['-Wno-dollar-in-identifier-extension']
                }
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
