[package]
name = "ghita-coding-agent"
version = "0.1.0"
description = "GHITA CODING AGENT Desktop"
authors = ["ghitatruongle"]
edition = "2021"

[lib]
name = "ghita_coding_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sidecar port model: uses a dynamic or fixed port allocated in sidecar configuration or environment variables.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.12", features = ["json"] }
local-ip-address = "0.6"
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
http = "1"
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"

# Phase 1: Computer-Use Rust backend (native screenshot + input + image resize)
screenshots = "0.8"
enigo = "0.2"
image = "0.24"
base64 = "0.22"

# Phase 2: Native PTY terminal (replaces node-pty sidecar)
portable-pty = "0.8"
dashmap = "6"

# Security & Utils
rand = "0.8"
percent-encoding = "2.3"
chrono = { version = "0.4", features = ["serde"] }
